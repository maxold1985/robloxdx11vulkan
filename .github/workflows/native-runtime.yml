name: native-runtime

on:
  push:
    branches:
      - mainn
  pull_request:
    branches:
      - mainn

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target roblox_runtime --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
